<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CASIO Premium - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 4px 30px rgba(0,0,0,0.06)',
            'card-hover': '0 8px 40px rgba(0,0,0,0.10)',
            'premium': '0 10px 40px rgba(15, 184, 111, 0.15)',
          },
        },
      },
    }
  </script>
  <style>
    * { font-family: 'Outfit', sans-serif; }
    body { background: #F8FDF9; color: #0F172A; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    .gradient-primary { background: linear-gradient(135deg, #0FB86F 0%, #00E58F 50%, #0FB86F 100%); }
    .input-modern { background: #FFFFFF; border: 1.5px solid #E2E8F0; transition: all 0.2s ease; }
    .input-modern:focus { border-color: #0FB86F; box-shadow: 0 0 0 4px rgba(15, 184, 111, 0.1); outline: none; }
  </style>
</head>
<body>
  <div class="min-h-screen flex items-center justify-center p-5 bg-[#F8FDF9]">
    <div class="w-full max-w-[400px]">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 gradient-primary rounded-2xl mx-auto flex items-center justify-center shadow-premium mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
        </div>
        <h1 class="text-[26px] font-black text-slate-900 tracking-tight">Welcome Back</h1>
        <p class="text-[13px] text-slate-500 font-medium mt-1 flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4 text-[#0FB86F]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Secure Login &bull; CASIO Premium
        </p>
      </div>

      <!-- Form -->
      <form id="loginForm" class="space-y-4 bg-white border border-slate-200 rounded-[24px] p-6 shadow-card">
        <div class="space-y-3">
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input id="email" class="w-full input-modern rounded-xl pl-10 pr-4 py-3.5 text-sm font-medium placeholder:text-slate-400" placeholder="Email Address" type="email" required />
          </div>
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input id="password" class="w-full input-modern rounded-xl pl-10 pr-4 py-3.5 text-sm font-medium placeholder:text-slate-400" placeholder="Password" type="password" required />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full gradient-primary py-3.5 rounded-xl font-bold text-sm text-white shadow-premium hover:brightness-105 flex items-center justify-center gap-2 transition-all">
          Login to Account
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>

        <div class="text-center space-y-3 pt-2">
          <p class="text-[13px] text-slate-600 font-medium">No account yet? <a href="#" class="text-[#0FB86F] font-bold hover:underline">Create Account</a></p>
          <div class="h-px bg-slate-100"></div>
          <a href="#" class="inline-flex items-center gap-1.5 text-[11px] text-slate-500 hover:text-slate-700 font-semibold bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Admin Portal
          </a>
        </div>

        <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 text-xs font-medium rounded-lg px-3 py-2.5 mt-2"></div>
      </form>

      <!-- Info Banner -->
      <div class="mt-6 bg-white border border-amber-200 rounded-2xl p-3 flex gap-2.5">
        <div class="w-8 h-8 bg-amber-50 border border-amber-200 rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <p class="text-[11px] text-slate-600 leading-relaxed font-medium">
          <span class="font-bold text-slate-900">Live Mode:</span> This is a real money educational platform. No real transactions.
        </p>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = `
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"></circle>
          <path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        Signing In...
      `;
      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-50");

      try {
        await signInWithEmailAndPassword(auth, email.value, password.value);
        alert("Login successful!");
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove("hidden");
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-50");
      }
    });
  </script>
</body>
</html>
